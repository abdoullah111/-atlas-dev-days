<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 120" role="img" aria-label="Atlas Dev Days" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a98ff"/>
      <stop offset="1" stop-color="#0a3ad0"/>
    </linearGradient>
    <clipPath id="badge"><rect x="5" y="8" width="104" height="104" rx="26"/></clipPath>
  </defs>

  <!-- mark: mountain scene inside a rounded badge -->
  <g clip-path="url(#badge)">
    <rect x="5" y="8" width="104" height="104" fill="url(#sky)"/>
    <circle cx="32" cy="36" r="7" fill="#ffffff" fill-opacity=".9"/>
    <!-- far peaks -->
    <polygon points="28,62 -4,112 52,112" fill="#8fb4ff"/>
    <polygon points="90,52 64,112 114,112" fill="#9ec1ff"/>
    <!-- main peak: lit side and shaded side -->
    <polygon points="58,28 14,112 52,112 50,92 60,72 54,56" fill="#ffffff"/>
    <polygon points="58,28 54,56 60,72 50,92 52,112 104,112" fill="#b4cdff"/>
    <!-- foreground ridge -->
    <path d="M5 104 C30 96 48 108 70 100 C88 94 100 100 109 98 V112 H5Z" fill="#0a2fb0"/>
  </g>

  <!-- wordmark -->
  <g font-family='"Segoe UI", Inter, Helvetica, Arial, sans-serif'>
    <text x="134" y="66" font-size="50" font-weight="800" letter-spacing="5" fill="#ffffff">ATLAS</text>
    <rect x="136" y="77" width="46" height="4" rx="2" fill="#3a7bff"/>
    <text x="135" y="104" font-size="19" font-weight="600" letter-spacing="9" fill="#6f9bff">DEV DAYS</text>
  </g>
</svg>
